name: Capital website QA

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: |
          node --check assets/main.js
          node --check assets/capital-data.js
          node --check assets/capital-upgrade.js
          node --check assets/capital-vision.js
          node --check assets/capital-uiux-v2.js
          node --check assets/availability-cinematic.js
          node --check scripts/qa_visual_v5.mjs
      - name: Capital structural and reality QA
        run: node scripts/qa_capital.mjs
      - name: Capital visual art direction QA
        run: node scripts/qa_visual_v5.mjs
